[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fiblock"
version = "0.1.0"
description = "FIBlock: model-based fault injection for cyber-physical systems, in Python"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Tagir Fabarisov"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
keywords = ["fault injection", "cyber-physical systems", "dependability", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/TagirFabarisov/FIBlock-Py"
"Original FIBlock (MATLAB/Simulink)" = "https://github.com/TagirFabarisov/FIBlock"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
